apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ncaleague.fullname" . }}
  labels:
    {{- include "ncaleague.labels" . | nindent 4 }}
spec:
  # Two replicas, and a new pod serves before an old one stops, so a deploy
  # keeps the app up. Migrations wait on an advisory lock.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      # The cluster's network policy admits database clients by component.
      labels:
        {{- include "ncaleague.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # The app talks to nothing in the cluster but its database.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ncaleague
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          # The database accepts TLS only, and the app verifies its
          # certificate against the operator's CA.
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.cluster }}-app
                  key: uri
            - name: DATABASE_URL
              value: $(DATABASE_URI)?sslmode=verify-full&sslrootcert=/etc/ncaleague/database/ca.crt
            {{- with .Values.telemetry.endpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ . }}
            - name: OTEL_SERVICE_NAME
              value: ncaleague
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: database-ca
              mountPath: /etc/ncaleague/database
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          # The app listens once it has migrated. The startup probe gives a
          # long migration a minute before liveness can restart the pod.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Ready means the database answers. Liveness stays on the port, so a
          # database outage doesn't restart the app.
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: database-ca
          secret:
            secretName: {{ .Values.database.cluster }}-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ncaleague.fullname" . }}
  labels:
    {{- include "ncaleague.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
