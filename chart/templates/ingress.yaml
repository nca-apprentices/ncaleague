{{- if .Values.ingress.enabled }}
# HSTS, which only the TLS edge can promise. The app sets its other security
# headers itself, so this sets no policy that would replace them.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ncaleague.fullname" . }}-headers
  labels:
    {{- include "ncaleague.labels" . | nindent 4 }}
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
# Compresses the pages, styles, and scripts on their way out.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ncaleague.fullname" . }}-compress
  labels:
    {{- include "ncaleague.labels" . | nindent 4 }}
spec:
  compress: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ncaleague.fullname" . }}
  labels:
    {{- include "ncaleague.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "ncaleague.fullname" . }}-headers@kubernetescrd,{{ .Release.Namespace }}-{{ include "ncaleague.fullname" . }}-compress@kubernetescrd{{ range .Values.ingress.middlewares }},{{ $.Release.Namespace }}-{{ . }}@kubernetescrd{{ end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ncaleague.fullname" . }}
                port:
                  name: http
{{- end }}
