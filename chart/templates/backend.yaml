apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ncaleague.fullname" . }}-backend
  labels:
    {{- include "ncaleague.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  # One replica: each pod migrates the database on start.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "ncaleague.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: backend
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}
          # The database accepts TLS only, and the backend and dbmate both
          # verify its certificate against the operator's CA.
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.cluster }}-app
                  key: uri
            - name: DATABASE_URL
              value: $(DATABASE_URI)?sslmode=verify-full&sslrootcert=/etc/ncaleague/database/ca.crt
          volumeMounts:
            - name: database-ca
              mountPath: /etc/ncaleague/database
              readOnly: true
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: database-ca
          secret:
            secretName: {{ .Values.database.cluster }}-ca
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ncaleague.fullname" . }}-backend
  labels:
    {{- include "ncaleague.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
