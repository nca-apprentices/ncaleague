# Secrets for pulling the image, such as [{ name: ghcr }].
imagePullSecrets: []

# Such as prod, so the pods schedule ahead of lower environments.
priorityClassName: ""

image:
  repository: ghcr.io/nca-apprentices/ncaleague
  tag: ""

resources:
  requests: { cpu: 50m, memory: 32Mi }
  limits: { memory: 128Mi }

# The CloudNativePG Cluster the app uses. The operator writes its
# credentials to the Secret <cluster>-app and its CA to <cluster>-ca.
database:
  cluster: ncaleague-db

ingress:
  enabled: true
  className: traefik
  host: ncaleague.example.com
  # Traefik Middlewares in the release's namespace that every request passes
  # after the headers, such as [github-login].
  middlewares: []
  # Requests per second that all clients share. Each open Live page polls
  # once a second.
  rateLimit: { average: 50, burst: 100 }
  tls:
    enabled: true
    secretName: ncaleague-tls
