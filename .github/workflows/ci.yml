name: CI

# Nothing here deploys: the infra repository pins a released chart version.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue runs the same checks on each merge group.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  # The integration tests create their databases on this server.
  app:
    name: Vet, test, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ncaleague
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ncaleague" --health-interval 1s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://ncaleague@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: govulncheck ./...
      - run: go test ./...
      - run: go build ./...

  # The browser suite against the production image on a fresh database.
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node
      - name: Browser
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - run: e2e/run.sh
        env:
          COMPOSE: docker compose

  chart:
    name: Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: helm
      - run: helm lint chart

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
