name: Release

on:
  push:
    tags: ["v*"]

# Each job gets only the permissions it needs.
permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  # A tag on a commit that fails CI ships nothing.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # One version ships everything: the image and the chart carry the tag.
  #
  # The image builds natively on one runner per architecture and is pushed
  # by digest only. The manifest job then puts both digests under the tag.
  image:
    name: Image
    needs: [ci]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ncaleague
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      # Every artifact carries a signed provenance attestation, so
      # `gh attestation verify` ties it to this run.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ncaleague
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # The digest travels to the manifest job as an empty file named after it.
      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Image manifest
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the manifest list
        working-directory: digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ncaleague
        run: |
          digests=(*)
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "${digests[@]/#/$IMAGE@sha256:}"

  chart:
    name: Helm chart
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      # The Helm that mise.toml pins, as in CI.
      - uses: jdx/mise-action@v4
        with:
          install_args: helm
      - name: Package
        run: |
          helm registry login ${{ env.REGISTRY }} --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          helm package chart --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME"
          helm push ncaleague-"${GITHUB_REF_NAME#v}".tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ncaleague-*.tgz

  release:
    name: GitHub release
    needs: [manifest, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
