name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # One version ships everything: both images and the chart carry the tag.
  #
  # Each image builds natively on one runner per architecture and is pushed
  # by digest only. The manifests job then puts both digests under the tag.
  images:
    name: Image
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        app: [backend, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ncaleague-${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ncaleague-${{ matrix.app }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      # The digest travels to the manifests job as an empty file named after it.
      - name: Record the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: Image manifest
    needs: [images]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.app }}-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the manifest list
        working-directory: digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ncaleague-${{ matrix.app }}
        run: |
          digests=(*)
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "${digests[@]/#/$IMAGE@sha256:}"

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Package
        run: |
          helm registry login ${{ env.REGISTRY }} --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          helm package chart --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME"
          helm push ncaleague-"${GITHUB_REF_NAME#v}".tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release:
    name: GitHub release
    needs: [manifests, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
