{{define "main"}}
  <main class="page">
    <h1>Ranking</h1>
    <div class="ranking">
      <section class="sheet">
        <table data-fit="{{.Paging.Name}}" data-rows="{{.Paging.Rows}}">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Name</th>
              <th>Winrate</th>
            </tr>
          </thead>
          <tbody>
            {{range $i, $r := .Rows}}
              <tr>
                <td>{{add $.First (add $i 1)}}</td>
                <td class="name">{{$r.Name}}</td>
                <td>{{$r.Winrate}}%</td>
              </tr>
            {{end}}
          </tbody>
        </table>
        {{template "pages" .Paging}}
      </section>
    </div>
  </main>
{{end}}
