{{define "main"}}
  <main class="page">
    <section class="sheet games">
      <h1>Games</h1>
      <div class="scroll">
        <table data-fit="{{.Paging.Name}}" data-rows="{{.Paging.Rows}}">
          <thead>
            <tr>
              <th>Start Date</th>
              <th>Mode</th>
              <th>Blue Offensive</th>
              <th>Blue Defensive</th>
              <th>Red Offensive</th>
              <th>Red Defensive</th>
              <th>Winning Team</th>
            </tr>
          </thead>
          <tbody>
            {{range .Rows}}
              <tr class="{{if .Shaded}}shaded{{end}}">
                <td data-label="Start Date">{{date .Start}}</td>
                <td data-label="Mode">{{.Mode}}</td>
                {{range $seat, $name := .Players}}
                  <td class="name" data-label="{{seat $seat}}">{{upper $name}}</td>
                {{end}}
                <td data-label="Winning Team">{{template "winner" .Winner}}</td>
              </tr>
            {{end}}
          </tbody>
        </table>
      </div>
      {{template "pages" .Paging}}
    </section>
  </main>
{{end}}
